{% extends "base.html" %}

{% block title %}Delete Document - DocuCollab{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
          <h2 class="mb-0">Delete Document</h2>
        </div>
        <div class="card-body">
          <p class="lead">Are you sure you want to delete the document <strong>{{ document.title }}</strong>?</p>
          <p class="text-muted">This action cannot be undone.</p>
          <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between align-items-center mt-4">
              <a href="{% url 'docs:detail_document' document.id %}" class="btn btn-link">Cancel</a>
              <button type="submit" class="btn btn-danger">Delete</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
