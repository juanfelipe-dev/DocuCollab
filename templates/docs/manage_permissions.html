{% extends "base.html" %}

{% block title %}Manage Permissions - DocuCollab{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-info text-white">
          <h2 class="mb-0">Manage Permissions for <span class="text-dark">{{ document.title }}</span></h2>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            <div class="table-responsive mb-3">
              <table class="table table-bordered align-middle">
                <thead class="table-light">
                  <tr>
                    <th>User</th>
                    <th>Can View</th>
                    <th>Can Edit</th>
                    <th>Can Delete</th>
                  </tr>
                </thead>
                <tbody>
                  {% for perm in permissions %}
                  <tr>
                    <td>{{ perm.user.username }}</td>
                    <td><input type="checkbox" name="view_{{ perm.user.id }}" {% if perm.can_view %}checked{% endif %} class="form-check-input"></td>
                    <td><input type="checkbox" name="edit_{{ perm.user.id }}" {% if perm.can_edit %}checked{% endif %} class="form-check-input"></td>
                    <td><input type="checkbox" name="delete_{{ perm.user.id }}" {% if perm.can_delete %}checked{% endif %} class="form-check-input"></td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-4">
              <a href="{% url 'docs:detail_document' document.id %}" class="btn btn-link">Cancel</a>
              <button type="submit" class="btn btn-info text-white">Save Permissions</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
